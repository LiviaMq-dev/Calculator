<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    

    <div class="calculator">
        <input type="text" id="inputBox" placeholder="0" readonly>

        <div>
            <button class="primeiro-button">AC</button>
            <button class="primeiro-button">DEL</button>
            <button class="primeiro-button">%</button>
            <button class="primeiro-button">/</button>
        </div>

        <div>
            <button class="segundo-button">7</button>
            <button class="segundo-button">8</button>
            <button class="segundo-button">9</button>
            <button class="segundo-button">*</button>
        </div>

        <div>
            <button class="terceiro-button">4</button>
            <button class="terceiro-button">5</button>
            <button class="terceiro-button">6</button>
            <button class="terceiro-button">-</button>
        </div>

        <div>
            <button class="quarto-button">1</button>
            <button class="quarto-button">2</button>
            <button class="quarto-button">3</button>
            <button class="quarto-button">+</button>
        </div>

        <div>
            <button class="quinto-button">00</button>
            <button class="quinto-button">0</button>
            <button class="quinto-button">.</button>
            <button class="quinto-button">=</button>
        </div>
       
    </div>


    <script src="script.js"></script>


</body>
</html>
